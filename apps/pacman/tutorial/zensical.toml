[project]
site_name = "Pac-Man Tutorial"
site_description = "Build a minimal Pac-Man game from scratch with C++23 and SDL3."
docs_dir = "."

nav = [
    { "Introduction" = "index.md" },
    { "Chapters" = [{ "1. A Window Into the Maze" = "01-window.md" }, { "2. Drawing the Maze" = "02-maze.md" }] },
]

[project.theme]
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tooltips",
    "navigation.footer",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
logo = "lucide/ghost"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
