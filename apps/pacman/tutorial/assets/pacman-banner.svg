<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Pac-Man and four ghosts in a dark maze">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09091a"/>
      <stop offset="1" stop-color="#151538"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcc00" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffcc00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>

  <!-- Dim tile dots -->
  <g fill="#2a2a66">
    <circle cx="80" cy="80" r="2"/><circle cx="140" cy="80" r="2"/><circle cx="200" cy="80" r="2"/>
    <circle cx="260" cy="80" r="2"/><circle cx="320" cy="80" r="2"/><circle cx="380" cy="80" r="2"/>
    <circle cx="440" cy="80" r="2"/><circle cx="500" cy="80" r="2"/><circle cx="560" cy="80" r="2"/>
    <circle cx="620" cy="80" r="2"/><circle cx="680" cy="80" r="2"/><circle cx="740" cy="80" r="2"/>
    <circle cx="800" cy="80" r="2"/><circle cx="860" cy="80" r="2"/><circle cx="920" cy="80" r="2"/>
    <circle cx="980" cy="80" r="2"/><circle cx="1040" cy="80" r="2"/><circle cx="1100" cy="80" r="2"/>

    <circle cx="80" cy="140" r="2"/><circle cx="140" cy="140" r="2"/><circle cx="200" cy="140" r="2"/>
    <circle cx="1000" cy="140" r="2"/><circle cx="1060" cy="140" r="2"/><circle cx="1120" cy="140" r="2"/>
    <circle cx="80" cy="320" r="2"/><circle cx="140" cy="320" r="2"/><circle cx="200" cy="320" r="2"/>
    <circle cx="1000" cy="320" r="2"/><circle cx="1060" cy="320" r="2"/><circle cx="1120" cy="320" r="2"/>
  </g>

  <!-- Simple maze walls -->
  <g fill="none" stroke="#2b2b8f" stroke-width="9" stroke-linecap="round" opacity="0.85">
    <path d="M50 120 V50 H310"/>
    <path d="M1150 120 V50 H890"/>
    <path d="M50 350 V410 H300"/>
    <path d="M1150 350 V410 H900"/>
    <path d="M530 50 V100 H670 V50"/>
  </g>

  <!-- Pellets -->
  <g fill="#ffd54a">
    <circle cx="380" cy="250" r="7"/>
    <circle cx="430" cy="250" r="7"/>
    <circle cx="480" cy="250" r="7"/>
    <circle cx="530" cy="250" r="7"/>
    <circle cx="580" cy="250" r="7"/>
    <circle cx="630" cy="250" r="7"/>
  </g>
  <g fill="#ffd54a" opacity="0.9">
    <circle cx="80" cy="220" r="11"/>
    <circle cx="1120" cy="220" r="11"/>
  </g>

  <!-- Pac-Man -->
  <circle cx="300" cy="255" r="165" fill="url(#glow)"/>
  <path d="M300 255 L376 222 A86 86 0 1 0 376 288 Z" fill="#ffd400"/>
  <circle cx="282" cy="232" r="10" fill="#0c0c1e" opacity="0.22"/>

  <!-- Ghosts -->
  <g transform="translate(700 205) scale(1.55)">
    <path d="M0 22 C0 7 11 0 30 0 C49 0 60 7 60 22 V62 L50 54 L40 62 L30 54 L20 62 L10 54 L0 62 Z" fill="#ff4d5e"/>
    <circle cx="19" cy="26" r="9" fill="#ffffff"/><circle cx="41" cy="26" r="9" fill="#ffffff"/>
    <circle cx="16" cy="26" r="4.5" fill="#2323a8"/><circle cx="38" cy="26" r="4.5" fill="#2323a8"/>
  </g>
  <g transform="translate(820 215) scale(1.55)">
    <path d="M0 22 C0 7 11 0 30 0 C49 0 60 7 60 22 V62 L50 54 L40 62 L30 54 L20 62 L10 54 L0 62 Z" fill="#ffb8de"/>
    <circle cx="19" cy="26" r="9" fill="#ffffff"/><circle cx="41" cy="26" r="9" fill="#ffffff"/>
    <circle cx="16" cy="26" r="4.5" fill="#2323a8"/><circle cx="38" cy="26" r="4.5" fill="#2323a8"/>
  </g>
  <g transform="translate(940 200) scale(1.55)">
    <path d="M0 22 C0 7 11 0 30 0 C49 0 60 7 60 22 V62 L50 54 L40 62 L30 54 L20 62 L10 54 L0 62 Z" fill="#63e7ff"/>
    <circle cx="19" cy="26" r="9" fill="#ffffff"/><circle cx="41" cy="26" r="9" fill="#ffffff"/>
    <circle cx="16" cy="26" r="4.5" fill="#2323a8"/><circle cx="38" cy="26" r="4.5" fill="#2323a8"/>
  </g>
  <g transform="translate(1060 212) scale(1.55)">
    <path d="M0 22 C0 7 11 0 30 0 C49 0 60 7 60 22 V62 L50 54 L40 62 L30 54 L20 62 L10 54 L0 62 Z" fill="#ffb852"/>
    <circle cx="19" cy="26" r="9" fill="#ffffff"/><circle cx="41" cy="26" r="9" fill="#ffffff"/>
    <circle cx="16" cy="26" r="4.5" fill="#2323a8"/><circle cx="38" cy="26" r="4.5" fill="#2323a8"/>
  </g>

  <text x="600" y="438" text-anchor="middle" fill="#6f6fa6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="7">C++23  ·  SDL3  ·  macOS</text>
